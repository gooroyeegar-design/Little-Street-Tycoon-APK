name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> "$GITHUB_PATH"

      - name: Prepare Android SDK
        run: |
          set -eux
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Download Godot
        run: |
          set -eux
          wget -q https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip
          unzip -q Godot_v4.4-stable_linux.x86_64.zip
          chmod +x Godot_v4.4-stable_linux.x86_64

      - name: Install matching export templates
        run: |
          set -eux
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_export_templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q Godot_v4.4-stable_export_templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.stable/"
          test -f "$HOME/.local/share/godot/export_templates/4.4.stable/android_debug.apk"
          test -f "$HOME/.local/share/godot/export_templates/4.4.stable/android_release.apk"
          test -f "$HOME/.local/share/godot/export_templates/4.4.stable/version.txt"

      - name: Configure Godot Android export
        run: |
          set -eux
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
[gd_resource type="EditorSettings" format=3]

[resource]

export/android/android_sdk_path = "$ANDROID_HOME"
export/android/java_sdk_path = "$JAVA_HOME"
export/android/debug_keystore = "$HOME/.android/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
EOF
          test -f "$HOME/.android/debug.keystore"

      - name: Check project scripts
        run: |
          set -eux
          ./Godot_v4.4-stable_linux.x86_64 --headless --path . --check-only --script res://main.gd

      - name: Import project
        run: |
          set -eux
          ./Godot_v4.4-stable_linux.x86_64 --headless --path . --editor --quit 2>&1 | tee godot-import.log

      - name: Export APK
        run: |
          set -eux
          mkdir -p build
          ./Godot_v4.4-stable_linux.x86_64 --headless --path . --export-debug "Android" build/Little-Street-Tycoon.apk 2>&1 | tee godot-export.log
          test -s build/Little-Street-Tycoon.apk
          file build/Little-Street-Tycoon.apk
          unzip -t build/Little-Street-Tycoon.apk >/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Little-Street-Tycoon-APK
          path: build/Little-Street-Tycoon.apk
          if-no-files-found: error
          retention-days: 30
