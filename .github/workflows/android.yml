name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip
          unzip -q Godot_v4.4-stable_linux.x86_64.zip
          chmod +x Godot_v4.4-stable_linux.x86_64

      - name: Download Android export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.4.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_export_templates.tpz
          unzip -q Godot_v4.4-stable_export_templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/4.4.stable/

      - name: Configure Godot Android paths
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/java_sdk_path = "$JAVA_HOME"
export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
EOF

      - name: Validate project
        run: |
          ./Godot_v4.4-stable_linux.x86_64 --headless --path . --editor --quit

      - name: Build Android APK
        run: |
          mkdir -p build
          ./Godot_v4.4-stable_linux.x86_64 --headless --path . --export-release "Android" build/Little-Street-Tycoon.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Little-Street-Tycoon-APK
          path: build/Little-Street-Tycoon.apk
          if-no-files-found: error
