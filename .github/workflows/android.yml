name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip
          unzip -q Godot_v4.4-stable_linux.x86_64.zip
          chmod +x Godot_v4.4-stable_linux.x86_64

      - name: Download Android export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.4.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_export_templates.tpz
          unzip -q Godot_v4.4-stable_export_templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/4.4.stable/

      - name: Validate project
        run: |
          ./Godot_v4.4-stable_linux.x86_64 --headless --path . --editor --quit

      - name: Build Android APK
        run: |
          mkdir -p build
          ./Godot_v4.4-stable_linux.x86_64 --headless --path . --export-release "Android" build/Little-Street-Tycoon.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Little-Street-Tycoon-APK
          path: build/Little-Street-Tycoon.apk
          if-no-files-found: error
